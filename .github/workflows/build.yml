name: Build gost-engine (upstream master)

on:
  schedule:
    # Weekly Monday 03:15 UTC
    - cron: '15 3 * * 1'
  workflow_dispatch:
    inputs:
      gost_sha:
        description: 'gost-engine commit SHA (empty = current master HEAD)'
        required: false
        default: ''
      force:
        description: 'Build even if a Release for this build_id already exists'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-gost-engine-master
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.up.outputs.sha }}
      short: ${{ steps.up.outputs.short }}
      build_id: ${{ steps.up.outputs.build_id }}
      should_build: ${{ steps.gate.outputs.should_build }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@main

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends jq curl ca-certificates

      - name: Resolve gost-engine/engine master (or input SHA)
        id: up
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.gost_sha }}" ]; then
            SHA="${{ inputs.gost_sha }}"
            # normalize short/full
            if [ ${#SHA} -lt 40 ]; then
              API="https://api.github.com/repos/gost-engine/engine/commits/${SHA}"
              SHA=$(curl -fsSL -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" "$API" \
                | jq -r .sha)
            fi
            SHORT="${SHA:0:12}"
            BUILD_ID="master-${SHORT}"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "short=$SHORT" >> "$GITHUB_OUTPUT"
            echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          else
            bash scripts/detect-gost-engine-master.sh | tee /tmp/up.env
            grep -E '^(sha|short|build_id)=' /tmp/up.env >> "$GITHUB_OUTPUT"
          fi
          echo "Upstream build_id=$(grep build_id= "$GITHUB_OUTPUT" | tail -1)"

      - name: Should we build?
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          BID="${{ steps.up.outputs.build_id }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if bash scripts/should-build.sh "$BID"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve distro matrix (last + previous majors)
        id: matrix
        run: |
          set -euo pipefail
          MATRIX=$(bash scripts/resolve-matrix.sh)
          echo "Matrix: $MATRIX"
          # Compact single line for output
          echo "matrix=$(jq -c . <<<"$MATRIX")" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix) }}

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --user root

    env:
      GOST_SHA: ${{ needs.resolve.outputs.sha }}
      BUILD_ID: ${{ needs.resolve.outputs.build_id }}
      DISTRO: ${{ matrix.distro }}
      DISTRO_VERSION: ${{ matrix.version }}
      BUILD_ROOT: /work/build
      OUT_DIR: /work/out
      PREFIX: /usr
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@main

      - name: Install build dependencies (Debian)
        if: matrix.distro == 'debian'
        run: |
          set -eu
          apt-get update -y
          apt-get install -y ca-certificates
          cat > /etc/apt/sources.list.d/gku.list << 'EOF'
          deb https://deb.debian.org/debian experimental main
          deb https://deb.debian.org/debian unstable main
          deb https://deb.debian.org/debian testing main
          EOF
          sed -i 's/^[[:space:]]*//' /etc/apt/sources.list.d/gku.list
          cat > /etc/apt/preferences.d/gku.pref << 'EOF'
          Package: *
          Pin: release a=testing
          Pin-Priority: -1
          
          Package: *
          Pin: release a=unstable
          Pin-Priority: -1
          
          Package: *
          Pin: release a=experimental
          Pin-Priority: -1
          EOF
          sed -i 's/^[[:space:]]*//' /etc/apt/preferences.d/gku.pref
          
          apt-get update -y
          
          # Проверка (можно оставить для отладки)
          echo "=== sources.list.d/gku.list ==="
          cat /etc/apt/sources.list.d/gku.list
          echo "=== available suites ==="
          apt-cache policy | head -20
          
          forcepack() {
            pack=$1
            DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::="--force-confnew" reinstall $pack
            DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::="--force-confnew" -t testing reinstall $pack
            DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::="--force-confnew" -t unstable reinstall $pack
            DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::="--force-confnew" -t experimental reinstall $pack
          }
          forcepackt() {
            pack=$1
            DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::="--force-confnew" reinstall $pack
            DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::="--force-confnew" -t testing reinstall $pack
            DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::="--force-confnew" -t unstable reinstall $pack
          }
          
          apt-get install -y build-essential autoconf automake libtool git
          rm -rf /usr/local/ssl/share/man/man1/*.1ossl
          rm -rf /usr/local/ssl/share/man/man3/*.3ossl
          rm -rf /usr/local/ssl/share/man/man7/*.7ossl
          rm -rf /usr/local/ssl/share/doc/openssl
          rm -rf /usr/local/ssl/bin
          rm -rf /usr/local/ssl/include
          rm -rf /usr/local/ssl/lib
          rm -rf /root/openssl
          rm -rf /usr/bin/openssl
          hash -r
          forcepackt "openssl libssl-dev"
          rm -rf /usr/local/doc/cmake-*
          rm -rf /usr/local/bin/ccmake
          rm -rf /usr/local/bin/cmake
          rm -rf /usr/local/bin/ctest
          rm -rf /usr/local/bin/cpack
          rm -rf /usr/local/share/cmake-*
          rm -rf /usr/local/share/vim/vimfiles/indent/cmake.vim
          rm -rf /usr/local/share/vim/vimfiles/syntax/cmake.vim
          rm -rf /usr/local/share/emacs/site-lisp/cmake-mode.el
          rm -rf /usr/local/share/aclocal/cmake.m4
          rm -rf /usr/local/share/bash-completion/completions/cmake
          rm -rf /usr/local/share/bash-completion/completions/cpack
          rm -rf /usr/local/share/bash-completion/completions/ctest
          hash -r
          forcepack cmake

      - name: Install build dependencies (Arch)
        if: matrix.distro == 'arch'
        run: |
          set -euo pipefail
          pacman-key --init
          pacman -Syu --noconfirm
          pacman -Sy --needed --noconfirm bash grep make autoconf automake libtool git openssl cmake

      - name: Install build dependencies (AlmaLinux)
        if: matrix.distro == 'almalinux'
        run: |
          set -euo pipefail
          dnf -y update
          dnf -y install epel-release
          dnf -y groupinstall "Development Tools"
          dnf -y update
          dnf -y install gcc gcc-c++ kernel-devel make git autoconf automake libtool git openssl openssl-devel cmake
      - name: Build gost-engine from upstream master commit
        run: bash scripts/build.sh

      - name: Test
        run: bash scripts/test.sh

      - name: Package
        run: bash scripts/package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: gost-engine-${{ needs.resolve.outputs.build_id }}-${{ matrix.distro }}-${{ matrix.version }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@main
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar*' -o -name '*.tar.gz' -o -name '*.tar.zst' \) \
            -exec cp -av {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.build_id }}
          name: Gost-engine master@${{ needs.resolve.outputs.short }}
          body: |
            Build of **gost-engine** commit [`${{ needs.resolve.outputs.sha }}`](https://github.com/gost-engine/engine/commit/${{ needs.resolve.outputs.sha }}).

            Distro matrix is resolved automatically (last + previous major for Debian & AlmaLinux, Arch rolling).

            ### Packages
            See assets below (`.deb` / `.rpm` / Arch).

          files: release-assets/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
